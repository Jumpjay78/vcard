<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitenkarte</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; margin: 0; }
    .scene { width: 100%; max-width: 400px; height: 460px; margin: 15px auto; perspective: 1000px; }
    .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
    .card.is-flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: white; border-radius: 18px; padding: 25px 20px; box-sizing: border-box; box-shadow: 0 6px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
    .card-back { transform: rotateY(180deg); }
    .greeting { font-size: 13px; color: #ff6600; font-weight: bold; text-transform: uppercase; }
    h2 { margin: 5px 0; font-size: 24px; }
    .subtitle { margin: 0; color: #666; font-size: 15px; }
    .status-badge { display: inline-block; background: #fff3eb; color: #cc5200; border: 1px solid #ffd6ba; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; margin: 12px auto; }
    .btn-primary { display: block; background: #ff6600; color: white; text-decoration: none; padding: 16px; border-radius: 12px; font-size: 17px; font-weight: bold; }
    .btn-secondary { display: block; background: #f8f8fa; color: #444; text-decoration: none; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-top: 10px; border: 1px solid #e5e5ea; }
    .flip-btn { background: #f0f0f5; color: #555; border: none; padding: 10px; border-radius: 20px; font-size: 13px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%; }
    .wechat-img { width: 190px; height: 190px; border-radius: 10px; margin: 8px auto; object-fit: contain; }
    .copy-box { background: #f4f4f9; padding: 10px 14px; border-radius: 10px; font-size: 14px; cursor: pointer; display: inline-block; border: 1px dashed #ccc; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div>
          <div id="txt-greeting" class="greeting">Hallo!</div>
          <h2 id="user-name">DEIN NAME</h2>
          <p id="user-role" class="subtitle">DEINE FIRMA / POSITION</p>
          <div id="live-status" class="status-badge">Status wird geladen...</div>
        </div>
        <div>
          <a id="btn-save" class="btn-primary" href="me.vcf" onclick="celebrate()">Kontakt speichern</a>
          <a id="btn-meet" class="btn-secondary" href="#">📍 Treffpunkt-Notiz senden</a>
          <button id="btn-flip-front" class="flip-btn" onclick="flipCard()">📱 Schütteln oder tippen für WeChat ↻</button>
        </div>
      </div>
      <div class="card-face card-back">
        <div>
          <h3 style="margin: 5px 0;">WeChat Connect</h3>
          <img id="wechat-qr" class="wechat-img" src="wechat.jpg" alt="WeChat QR Code"><br>
          <div class="copy-box" onclick="copyWeChat()">
            WeChat ID: <strong id="wechat-id-text">DEINE_WECHAT_ID</strong> 📋
            <div id="copy-feedback" style="font-size: 12px; color: #2e7d32;"></div>
          </div>
        </div>
        <button id="btn-flip-back" class="flip-btn" onclick="flipCard()">↺ Zurück zur Visitenkarte</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      name: "Jens-Peter Lehmann",
      role: "Classic Line GmbH / Geschäftsführer",
      email: "jens@classicline-gmbh.de",
      wechatId: "Jumpjay78",
      wechatImage: "WeChat.jpg"
    };

    document.getElementById('user-name').innerText = CONFIG.name;
    document.getElementById('user-role').innerText = CONFIG.role;
    document.getElementById('wechat-id-text').innerText = CONFIG.wechatId;
    document.getElementById('wechat-qr').src = CONFIG.wechatImage;

    const lang = (navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : ((navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en');
    const I18N = {
      de: { g: "Schön, dass wir uns vernetzen!", s: "Kontakt speichern", sd: "✅ Gespeichert!", m: "📍 Treffpunkt-Notiz senden", ff: "📱 Schütteln oder tippen für WeChat ↻", fb: "↺ Zurück", cp: "✅ Kopiert!", st: ["☕ Wach & bereit", "🍜 Mittagspause", "🚀 Im Arbeitsmodus", "🍻 Feierabend", "😴 Schläft (WeChat!)"] },
      zh: { g: "你好! 很高兴认识你", s: "保存联系人", sd: "✅ 已保存!", m: "📍 发送邮件交换联系方式", ff: "📱 摇一摇或点击查看微信 ↻", fb: "↺ 返回", cp: "✅ 已复制!", st: ["☕ 精神饱满", "🍜 午休时间", "🚀 工作中", "🍻 下班时间", "😴 休息中 (请发微信!)"] },
      en: { g: "Great to connect with you!", s: "Save Contact", sd: "✅ Saved!", m: "📍 Send 'Nice meeting you' note", ff: "📱 Shake or tap for WeChat ↻", fb: "↺ Back", cp: "✅ Copied!", st: ["☕ Awake & ready", "🍜 Lunch break", "🚀 Working", "🍻 Evening mode", "😴 Sleeping (Use WeChat!)"] }
    };

    const t = I18N[lang];
    document.getElementById('txt-greeting').innerText = t.g;
    document.getElementById('btn-save').innerText = t.s;
    document.getElementById('btn-meet').innerText = t.m;
    document.getElementById('btn-meet').href = "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent("Kontakt: " + CONFIG.name);
    document.getElementById('btn-flip-front').innerText = t.ff;
    document.getElementById('btn-flip-back').innerText = t.fb;

    function updateStatus() {
      const now = new Date();
      const timeStr = new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' }).format(now);
      const h = parseInt(new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', hour: 'numeric', hour12: false }).format(now), 10);
      const idx = (h >= 8 && h < 12) ? 0 : (h >= 12 && h < 14) ? 1 : (h >= 14 && h < 18) ? 2 : (h >= 18 && h < 22) ? 3 : 4;
      document.getElementById('live-status').innerText = timeStr + " (DE) – " + t.st[idx];
    }
    updateStatus();
    setInterval(updateStatus, 60000);

    function copyWeChat() {
      navigator.clipboard.writeText(CONFIG.wechatId);
      document.getElementById('copy-feedback').innerText = t.cp;
      setTimeout(() => { document.getElementById('copy-feedback').innerText = ""; }, 2000);
    }

    const card = document.getElementById('card');
    let lastShake = 0;
    function flipCard() {
      card.classList.toggle('is-flipped');
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission().catch(() => {});
      }
    }
    window.addEventListener('devicemotion', e => {
      const a = e.accelerationIncludingGravity;
      if (a && (Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z)) > 32 && (Date.now() - lastShake) > 1200) {
        lastShake = Date.now();
        card.classList.toggle('is-flipped');
      }
    });

    function celebrate() {
      const b = document.getElementById('btn-save');
      b.innerText = t.sd;
      setTimeout(() => { b.innerText = t.s; }, 3000);
    }
  </script>
</body>
</html>
